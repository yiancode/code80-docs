<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Grok CLI 本地模型目录示例</title>
  <desc id="desc">展示 Grok CLI 1.1.7 的版本和本地模型目录，其中 grok-code-fast-1 是 grok-4.3 的别名。</desc>
  <rect width="1440" height="900" rx="22" fill="#0d1117"/>
  <rect width="1440" height="62" rx="22" fill="#171d26"/><rect y="40" width="1440" height="22" fill="#171d26"/>
  <circle cx="32" cy="31" r="9" fill="#ff5f57"/><circle cx="62" cy="31" r="9" fill="#febc2e"/><circle cx="92" cy="31" r="9" fill="#28c840"/>
  <text x="126" y="38" fill="#aab4c3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">grok — model catalog</text>
  <text x="54" y="122" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">$ grok --version</text>
  <text x="54" y="166" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">1.1.7</text>
  <text x="54" y="238" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">$ grok models</text>
  <text x="54" y="284" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">Available Grok Models:</text>
  <text x="82" y="344" fill="#56d364" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">grok-4.3</text>
  <text x="300" y="344" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">— Grok 4.3 (reasoning)</text>
  <text x="82" y="390" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">aliases: grok-4-1-fast, grok-4-fast, grok-code-fast-1</text>
  <text x="82" y="452" fill="#56d364" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">grok-4.20-multi-agent-0309</text>
  <text x="82" y="514" fill="#56d364" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">grok-4.20-0309-reasoning</text>
  <text x="82" y="576" fill="#56d364" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">grok-4.20-non-reasoning</text>
  <text x="82" y="638" fill="#56d364" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">grok-3-mini</text>
  <rect x="54" y="704" width="1332" height="116" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="82" y="750" fill="#f2cc60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="23">注意</text>
  <text x="166" y="750" fill="#c9d1d9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">这里是 CLI 本地目录，不代表 Code80 API Key 一定有权限调用。</text>
  <text x="82" y="788" fill="#c9d1d9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">首次中转验证建议显式使用 grok -m grok-4.3。</text>
</svg>
