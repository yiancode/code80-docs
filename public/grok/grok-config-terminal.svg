<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Grok CLI Code80 配置终端示例</title>
  <desc id="desc">展示 user-settings.json、GROK_BASE_URL 和默认模型的脱敏终端示例。</desc>
  <rect width="1440" height="900" rx="22" fill="#0d1117"/>
  <rect width="1440" height="62" rx="22" fill="#171d26"/>
  <rect y="40" width="1440" height="22" fill="#171d26"/>
  <circle cx="32" cy="31" r="9" fill="#ff5f57"/><circle cx="62" cy="31" r="9" fill="#febc2e"/><circle cx="92" cy="31" r="9" fill="#28c840"/>
  <text x="126" y="38" fill="#aab4c3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">grok-config — zsh</text>
  <text x="54" y="122" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">$ cat ~/.grok/user-settings.json</text>
  <text x="54" y="170" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">{</text>
  <text x="84" y="214" fill="#a5d6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">"apiKey": <tspan fill="#ffa657">"your-api-key"</tspan>,</text>
  <text x="84" y="258" fill="#a5d6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">"defaultModel": <tspan fill="#ffa657">"grok-4.3"</tspan></text>
  <text x="54" y="302" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">}</text>
  <text x="54" y="374" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">$ export GROK_BASE_URL="https://code.ai80.vip/v1"</text>
  <text x="54" y="438" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">$ echo "$GROK_BASE_URL"</text>
  <text x="54" y="482" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">https://code.ai80.vip/v1</text>
  <text x="54" y="554" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">$ GROK_MODEL=grok-4.3 grok -p "只回复 OK"</text>
  <text x="54" y="598" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">OK</text>
  <rect x="54" y="656" width="1332" height="142" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="82" y="704" fill="#f2cc60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24">配置要点</text>
  <text x="82" y="746" fill="#c9d1d9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">Key 放入 user-settings.json；中转地址用 GROK_BASE_URL，并保留 /v1。</text>
</svg>
